# Default experiment configuration.
# Override with: ragbench <command> --config config/default.yaml
#
# Paths are relative to the project root, so commands work from the repo root
# on any machine.

paths:
  datasets: datasets
  artifacts: artifacts
  corpora: artifacts/corpora
  indexes: artifacts/indexes
  results: artifacts/results
  database: artifacts/benchmark.sqlite

# Global chunking default. Adapters override this per dataset (see below and
# docs/METHODOLOGY.md for the rationale behind each value).
chunk:
  strategy: fixed
  size_tokens: 256
  overlap_tokens: 64
  max_tokens: 512
  min_chunk_chars: 20

retrieval:
  top_k: 10
  metric_ks: [1, 5, 10]
  methods: [bm25, dense, hybrid]
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60
  rrf_candidate_depth: 100

embedding:
  # Cached locally, 384-dimensional, 256-token input limit -- which is why the
  # default chunk size is 256 tokens.
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  device: null        # null -> cuda when available, else cpu
  normalize: true     # required for FAISS inner product to equal cosine

generation:
  enabled: false      # retrieval benchmarks never require Ollama
  model: llama3.1     # single-model `generate` command
  # Compared by `generate-all`. Each model answers byte-identical context.
  models: [llama3.1, gemma2, mistral, qwen2.5]
  host: http://localhost:11434
  temperature: 0.0    # deterministic: model differences, not sampling noise
  max_context_chunks: 5
  timeout_seconds: 120
  num_predict: 512
  # 100 questions x 6 datasets x 3 strategies x 4 models = 7,200 generations.
  # Raised from 50 so each (dataset, strategy, model) cell has enough answers to
  # compare models rather than merely demonstrate the pipeline.
  queries_per_dataset: 100

scoring:
  # One fixed judge rates every model's answers, so faithfulness is comparable
  # across models rather than each model grading its own output.
  #
  # The judge is deliberately NOT one of the models under test. mistral was used
  # for the first pass and came out top of the metric it was judging, which is
  # unfalsifiable from inside the experiment: the ordering is equally consistent
  # with mistral being the most faithful model and with a judge preferring its
  # own style. phi3 is outside the compared set, so that question does not
  # arise, and it is smaller than all four, which matters because faithfulness
  # costs two judge calls per answer and dominates the scoring runtime.
  judge_model: phi3
  # Faithfulness is the most expensive measure in the framework, so it is run
  # over a stratified subsample rather than every answer. NLI hallucination is
  # cheap and covers all of them.
  # Drawn as a stratified sample across every (dataset, method, model) cell.
  # With 6 datasets x 3 strategies x 4 models there are 72 cells, so 1,440 gives
  # 20 answers per cell. The previous 600 gave about 8, which is too thin to
  # support a claim that one model is more faithful than another: the sample
  # size that matters is the one inside a cell, not the total.
  faithfulness_sample: 1440
  nli_model: cross-encoder/nli-deberta-v3-base
  entail_threshold: 0.5
  nli_batch_size: 32
  nli_max_length: 512

seed: 42
log_level: INFO

datasets:
  cuad:
    split: all
  casehold:
    split: test
  medqa:
    split: test
    # The full 89 MB textbook corpus. Set max_documents to a small number for
    # quick runs; leave unset for the real experiment.
    # max_documents: 3
  pubmedqa:
    split: labeled
  qasper:
    split: test
  sciq:
    split: test
